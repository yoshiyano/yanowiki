<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    webFileDir のアイコン（自前で描いたもの）。<svg><use href="icons.svg#i-folder"/></svg> で使う。
    色は CSS 変数（fd-icon- で始まる名前）で変えられる。操作アイコンは currentColor の線で描く。
    注意: XML のコメントの中には、ハイフン 2 つを続けて書けない（書くとこのファイル全体が読めなくなる）。
  -->
  <defs>
    <path id="fd-page" d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"
          style="fill:var(--fd-icon-page,#fff);stroke:var(--fd-icon-page-line,#8a94a3)" stroke-width="1"/>
    <path id="fd-fold" d="M14 2v4a1 1 0 0 0 1 1h4" fill="none"
          style="stroke:var(--fd-icon-page-line,#8a94a3)" stroke-width="1"/>
  </defs>

  <!-- ===== 項目の種類 ===== -->
  <symbol id="i-folder" viewBox="0 0 24 24">
    <path d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v1H2z" style="fill:var(--fd-icon-folder-back,#d9a53a)"/>
    <path d="M2 9h20v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" style="fill:var(--fd-icon-folder,#f2c55c)"/>
  </symbol>

  <symbol id="i-file" viewBox="0 0 24 24">
    <use href="#fd-page"/><use href="#fd-fold"/>
  </symbol>

  <symbol id="i-text" viewBox="0 0 24 24">
    <use href="#fd-page"/><use href="#fd-fold"/>
    <path d="M8 11h8M8 14h8M8 17h5" style="stroke:var(--fd-icon-text,#6b7686)" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-image" viewBox="0 0 24 24">
    <use href="#fd-page"/><use href="#fd-fold"/>
    <rect x="7" y="10" width="10" height="9" rx="1" style="fill:var(--fd-icon-image,#3a9a64)"/>
    <circle cx="14.5" cy="12.5" r="1.2" fill="#fff"/>
    <path d="M7.5 18.5l3-4 2 2.5 1.5-1.5 2.5 3z" fill="#fff"/>
  </symbol>

  <symbol id="i-audio" viewBox="0 0 24 24">
    <use href="#fd-page"/><use href="#fd-fold"/>
    <rect x="7" y="10" width="10" height="9" rx="1" style="fill:var(--fd-icon-audio,#8b5cc7)"/>
    <path d="M11 17.2V12l4-1v5" fill="none" stroke="#fff" stroke-width="1.1"/>
    <circle cx="10.2" cy="17.2" r="1.1" fill="#fff"/><circle cx="14.2" cy="16.2" r="1.1" fill="#fff"/>
  </symbol>

  <symbol id="i-video" viewBox="0 0 24 24">
    <use href="#fd-page"/><use href="#fd-fold"/>
    <rect x="7" y="10" width="10" height="9" rx="1" style="fill:var(--fd-icon-video,#d0503f)"/>
    <path d="M10.5 12v5l4.5-2.5z" fill="#fff"/>
  </symbol>

  <symbol id="i-pdf" viewBox="0 0 24 24">
    <use href="#fd-page"/><use href="#fd-fold"/>
    <rect x="7" y="10" width="10" height="9" rx="1" style="fill:var(--fd-icon-pdf,#c62f3a)"/>
    <path d="M9 12.5h6M9 14.5h6M9 16.5h4" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-archive" viewBox="0 0 24 24">
    <use href="#fd-page"/><use href="#fd-fold"/>
    <rect x="10" y="3" width="3" height="16" style="fill:var(--fd-icon-archive,#a07040)"/>
    <path d="M10 5h1.5M11.5 7H13M10 9h1.5M11.5 11H13M10 13h1.5" stroke="#fff" stroke-width="1"/>
    <rect x="9.5" y="15" width="4" height="4" rx="0.8" fill="#fff" style="stroke:var(--fd-icon-archive,#a07040)"/>
  </symbol>

  <symbol id="i-code" viewBox="0 0 24 24">
    <use href="#fd-page"/><use href="#fd-fold"/>
    <rect x="7" y="10" width="10" height="9" rx="1" style="fill:var(--fd-icon-code,#2f6fb8)"/>
    <path d="M10.5 12.5L8.8 14.5l1.7 2M13.5 12.5l1.7 2-1.7 2" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-sheet" viewBox="0 0 24 24">
    <use href="#fd-page"/><use href="#fd-fold"/>
    <rect x="7" y="10" width="10" height="9" rx="1" style="fill:var(--fd-icon-sheet,#2e8b57)"/>
    <path d="M7 13h10M7 16h10M11 10v9" stroke="#fff" stroke-width="0.9"/>
  </symbol>

  <symbol id="i-doc" viewBox="0 0 24 24">
    <use href="#fd-page"/><use href="#fd-fold"/>
    <rect x="7" y="10" width="10" height="9" rx="1" style="fill:var(--fd-icon-doc,#3a5fcd)"/>
    <path d="M9 12.5h6M9 14.5h6M9 16.5h6" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-link" viewBox="0 0 24 24">
    <path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"
          style="fill:var(--fd-icon-page,#fff);stroke:var(--fd-icon-page-line,#8a94a3)" stroke-width="1" stroke-dasharray="2 1.5"/>
    <path d="M9 17c0-3 2-5 5-5M12 10l2.5 2L12 14" fill="none" style="stroke:var(--fd-icon-link,#8a94a3)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 8l8 12" style="stroke:var(--fd-icon-link-ng,#c62828)" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-mount" viewBox="0 0 24 24">
    <rect x="2.5" y="7" width="19" height="10" rx="2" style="fill:var(--fd-icon-mount,#e4e8ee);stroke:var(--fd-icon-page-line,#8a94a3)" stroke-width="1"/>
    <circle cx="17.5" cy="12" r="1.2" style="fill:var(--fd-icon-mount-led,#3a9a64)"/>
    <path d="M6 12h7" style="stroke:var(--fd-icon-page-line,#8a94a3)" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <!-- ===== 操作 ===== -->
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5M11 6l-6 6 6 6"/>
  </symbol>
  <symbol id="i-forward" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14M13 6l6 6-6 6"/>
  </symbol>
  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5M6 11l6-6 6 6"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/>
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 6l6 6-6 6"/>
  </symbol>
  <symbol id="i-view-large" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/>
    <rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/>
  </symbol>
  <symbol id="i-view-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <rect x="3" y="4" width="4" height="4" rx="0.5"/><path d="M9 6h3"/><rect x="14" y="4" width="4" height="4" rx="0.5"/><path d="M20 6h1"/>
    <rect x="3" y="11" width="4" height="4" rx="0.5"/><path d="M9 13h3"/><rect x="14" y="11" width="4" height="4" rx="0.5"/><path d="M20 13h1"/>
    <rect x="3" y="18" width="4" height="4" rx="0.5"/><path d="M9 20h3"/>
  </symbol>
  <symbol id="i-view-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M3 5h1M7 5h4M3 10h1M7 10h4M3 15h1M7 15h4M3 20h1M7 20h4M14 5h1M18 5h3M14 10h1M18 10h3M14 15h1M18 15h3"/>
  </symbol>
  <symbol id="i-view-details" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M3 5h18M3 10h9M15 10h6M3 15h9M15 15h6M3 20h9M15 20h6"/>
  </symbol>
  <symbol id="i-sort-asc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 19V5M3 9l4-4 4 4M14 7h7M14 12h5M14 17h3"/>
  </symbol>
  <symbol id="i-sort-desc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 5v14M3 15l4 4 4-4M14 7h3M14 12h5M14 17h7"/>
  </symbol>
  <symbol id="i-new-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/>
  </symbol>
  <symbol id="i-new-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/>
  </symbol>
  <symbol id="i-rename" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>
  </symbol>
  <symbol id="i-delete" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>
  </symbol>
  <symbol id="i-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24">
    <path d="M5 7h14l-1.2 12.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z" style="fill:var(--fd-icon-trash,#c9d1db);stroke:var(--fd-icon-page-line,#8a94a3)" stroke-width="1"/>
    <path d="M3.5 7h17M9 7V4.5h6V7" fill="none" style="stroke:var(--fd-icon-page-line,#8a94a3)" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M10 10.5v7M14 10.5v7" style="stroke:var(--fd-icon-page-line,#8a94a3)" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-cut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/><path d="M8.3 15.7L18 4M15.7 15.7L6 4"/>
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
  </symbol>
  <symbol id="i-paste" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 4h6v3H9z"/><path d="M15 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M9 13h6M9 16h4"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M6 6l12 12M18 6L6 18"/>
  </symbol>
  <symbol id="i-split" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/>
  </symbol>
  <symbol id="i-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/>
  </symbol>
</svg>
