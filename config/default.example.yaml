# 個別Wikiの設定・既定値。**このファイル自身が実際に読まれます**
# （config/default.yaml という別ファイルは用意しません。Gitの追跡対象で、
# git pull 等で更新されます）。
#
# このファイルは全Wikiの土台になります。
# そのうえに wikidata/<Wiki名>/config/default.yaml があれば重なり、
# 書かれた項目だけを上書きします。書かれていない項目はここの値がそのまま残るので、
# 個別Wiki側には「変えたい項目だけ」を書けば十分です（無くても構いません）。
#
# 全Wiki共通であなたの環境向けに書き換えたい場合は、このファイルを直接
# 編集してください（Gitで管理する場合は、その変更をコミットしてください）。
# 特定のWikiだけを変えたい場合は wikidata/<Wiki名>/config/default.yaml を
# 作ってください（新規Wiki作成画面から作った場合は、このファイルの
# コピーが最初から置かれています）。
#
# サービスの起動に関わる設定（server / farm / debug）は server.yaml のほうです。
# ここや個別Wikiに書いても効きません。

edit:
  # 新しく作るページをどの記法で書くか（pukiwiki / markdown）。
  # すでにあるページの記法は拡張子（.txt / .md）で決まっているので関係しません。
  # ここで決まるのは新規ページの初期値だけで、編集画面のツールバーの右端から
  # 選び直せます（選び直すと保存先の拡張子も変わります）。
  # 書き損じ・知らない名前のときは pukiwiki として扱います。
  defaultwiki: pukiwiki
  # 編集画面のサイドバーのページ一覧で、タイトルが長いときどこで打ち切るか。
  # 全角文字は2文字ぶんとして数える（半角換算の幅。例: 半角12＋全角6で24）。
  title_length: 24
  # ツールバーの「文字色」「背景色」ボタンで、標準の16色（黒・赤・青…）に
  # 加えて出す、このWiki固有の色（16個、#rrggbb）。自由に書き換えられる
  # （PukiWiki記法のみで使う。&color(fg=/bg=){…}; の値としてそのまま渡る）。
  custom_colors:
    - "#e74c3c"
    - "#e67e22"
    - "#f1c40f"
    - "#2ecc71"
    - "#1abc9c"
    - "#3498db"
    - "#9b59b6"
    - "#34495e"
    - "#c0392b"
    - "#d35400"
    - "#f39c12"
    - "#27ae60"
    - "#16a085"
    - "#2980b9"
    - "#8e44ad"
    - "#7f8c8d"

account:
  # ユーザ登録（ログイン画面の「アカウント作成」）の受け入れかた（open / approval）。
  #   open      誰でも自由にアカウントを作れる。既定で、これまでの動きそのもの
  #   approval  誰でも申請できるが、助手（staff）か管理者が承認するまで使えない
  #             （申請されたアカウントは承認待ちで始まり、ログインできず、権限の上でも
  #             未ログインと同じ。承認は /.admin/approvals）
  # **決めるのは登録だけです。** 誰が何を読めて書けるかは、ページごとの権限
  # （config/privileges・/.admin/privileges）が決めます。ログインは「誰が編集したか」を
  # 記録するための仕組みで、編集を制限する関門ではありません。
  # 書き損じ・知らない値は open として扱います。
  policy: open
  # パスワードのハッシュに混ぜる塩。ハッシュは「塩 + ID + パスワード」から作ります。
  # **空のままなら Wiki名**（既定。別のWikiで同じID・同じパスワードでも値が違います）。
  # **変えると、全アカウントのパスワードが通らなくなります**（生のパスワードは持って
  # いないので作り直せません）。Wiki名を変えるときは、旧名がここへ自動で固定されます。
  # 設定画面（/.admin/configwiki）では、警告と「理解して編集」のチェックを入れたときだけ
  # 編集できます。
  pw_salt: ""

attach:
  # 添付ファイル1つあたりの大きさの上限。
  # bottle 側に上限があるわけではなく、置き場所を使い切らないための取り決め。
  # "20MB" のような書きかたのほか、単位なしの数（byte）でも指定できる。
  # 読めない書きかたのときは 20MB として扱う。
  max_size: 20MB

plugin:
  # プラグインが実行できない（引数の指定が正しくない・記法に対応していない・
  # 実行時に例外が起きた等）とき、そのプラグインの _help()（無ければモジュールの
  # docstring）を折りたたみで添えるか。
  # トレースバックを出す server.yaml の debug とは別の設定。あちらは実装の
  # 中身を追う開発者向け、こちらは「どう書けば動くか」を示す使い手・作り手向け。
  debug: false

markdown:
  preset: gfm-like  # markdown-it-pyのプリセット（GitHub Flavored Markdown相当）
  linkify: true      # 裸のURLを自動リンク化するか
  # "http://" の無い裸の語（"CLAUDE.md" 等）まで、ドメインらしいと
  # 判定してリンク化するか。既定は有効（true）。誤ってリンクになる場合は
  # false にする。"https://..." のような本物のURLはこの設定に関わらずリンクになる。
  linkify_fuzzy: true
  # 本文に書かれた生HTMLをどこまで通すか。**既定は false（通さない）**。
  #   false … 一切通さない。書いたものは文字としてそのまま出る
  #   true  … 許可したタグ・属性だけ通す（script/style/iframe/form/on*属性/
  #           javascript: などは文字にする。詳しくは _sys/wikilib/htmlpolicy.py）
  #   all   … すべて通す。**編集できる人を全面的に信頼できる場合だけ**
  # 2026-09-02より前は true が「すべて通す」の意味だった（いまの all）。
  allow_html: false
  anchors: true      # 見出しにidを振る（目次のリンク先として使う）
  # サイドバーの目次に出す見出しの深さ（h1〜hN）。表示の都合だけの設定で、
  # 見出しにidを振る範囲とは関係しない（idは常にh1〜h6すべてに振られる）。
  toc_depth: 3
  # 1行目がh1見出しならページタイトルとして扱い、本文と目次から取り除く。
  # 2つ目以降のh1は通常の章見出しとして扱われるため、章をh1から書き始められる。
  # falseにすると1行目のh1も本文中の見出しとしてそのまま描画される。
  first_h1_as_title: true
  # ページの一覧（編集画面のページ一覧・#ls など）で、名前の代わりに何を出すか。
  #   fname … ファイル名（ページ名）
  #   title … 本文の見出し（無ければファイル名で代用）
  # Markdownは見出し（# 見出し）を基準に書く記法なので、既定は title
  # （PukiWiki記法は逆にファイル名を基準に書く歴史的な流儀のため、既定が
  # 違う。Wiki設計者の指示、2026-09-18。書き損じ・知らない値は既定に戻す）。
  listname: title

pukiwiki:
  # 生HTMLの扱い。値の意味は markdown.allow_html と同じ（既定は false）。
  # 本家PukiWikiもHTMLは書けない決まりなので、既定を緩める理由は薄い。
  allow_html: false
  # PukiWiki記法（.txt）の「フェイスマーク定義ルール」
  # （config/pukiwiki.extrarules.yaml の facemark_rules）を使うか。
  # false にすると一括で無効化する（本家の $usefacemark に相当）。
  # ユーザ定義ルール（line_rules）はこの設定と関係なく常に有効。
  facemark: true
  # 大文字始まりの単語が2つ以上続く語（例: "PukiWiki"）を、そのページへの
  # 自動リンクにするか（WikiName）。false にすると、ただの文字列として扱う
  # （本家の $nowikiname の逆）。
  wikiname: true
  # ページの一覧で名前の代わりに何を出すか。値の意味は markdown.listname と
  # 同じ（fname / title）。PukiWiki記法はファイル名を基準に書く歴史的な
  # 流儀のため、既定は fname（markdown.listname とは逆）。
  listname: fname

theme:
  name: base           # 使用するテーマ名。base なら theme/base.html（＋base.css / base.js）を参照する
                          # theme/base/ のようなフォルダがあれば、その中の base.html/base.css/base.js を使う
                          # （フォルダはサブフォルダとしてではなく、そのテーマ専用のbasedirとして扱われる）
  site_title: wikiSystem  # ヘッダに表示するサイト名
  # ページ一覧（ページ選択・名前を変える・履歴の画面）に index を出すか。
  # index はファイルの置き場所を決めるためにシステムが要求している名前で、
  # 使う人から見ればフォルダそのものを指します。そのため既定では出さず、
  # フォルダの行がその入口ページを兼ねます。
  # index を名指しで扱いたいときだけ true にしてください。
  show_index: false
  # テーマを選ぶセレクタ（と「既定に戻す」ボタン）を画面に出すか。
  # 主に**サイトを作る人が、実際の画面で見た目を見比べるための道具**です。
  # 真にすると、menu1（サイドバー上段）の先頭に差し込まれます——テーマ側の
  # ファイルは1つも直さずに、menu1を出すどのテーマでも使えます。
  # 選んだテーマは cookie に1日おぼえ、そのWiki（farm）の中だけで効きます
  # （下の name より優先。「既定に戻す」でcookieを消すと name に戻ります）。
  selector: false
  # ページ生成時に一緒にレンダリングするメニューページ。
  # 該当ページが無い場合は空として扱われ、そのメニュー枠は表示されない。
  menu1_page: mainmenu
  menu2_page: submenu
  # サイドバー上段・下段（menu1/menu2）を、狭い画面でも常に開いたままに
  # したいページを "ページ名,モード" の形で指定する（省略・該当無し・
  # モードの綴りが auto/fix のどちらでもない場合は "auto"＝帯として
  # 折りたたむ、が既定）。menu1・menu2は別々に指定する。
  # menu1_mode:
  #   - "FrontPage,fix"
  #   - "Some/Deep/Page,auto"   # 明示的にautoを書いても既定と同じ（省略可）
  # menu2_mode:
  #   - "FrontPage,fix"
