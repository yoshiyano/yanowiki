<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マーカー</title>
<!-- 資材は相対URL。このウィンドウは <入口>/.markers-panel で開かれるので、
     server.prefix でサブパスに置いても、Wiki名付きで開いても、同じ階層の
     .markers-panel.css / .js を指す（先頭 / の直書きだと接頭辞が落ちる） -->
<link rel="stylesheet" href=".markers-panel.css">
</head>
<body>
<div class="mp-shell">
  <div class="mp-setrow">
    <select class="mp-set-select" aria-label="用語セット"></select>
    <button type="button" class="mp-set-new" title="新しい用語セットを作る">＋</button>
    <button type="button" class="mp-set-rename" title="この用語セットの名前を変える">名前</button>
    <button type="button" class="mp-set-delete" title="この用語セットを削除する">削除</button>
  </div>

  <ol class="mp-terms" aria-label="用語一覧"></ol>

  <form class="mp-add-form">
    <input type="text" class="mp-add-term" placeholder="新しい用語" aria-label="新しい用語" autocomplete="off">
    <button type="button" class="mp-add-color" aria-label="色を選ぶ" title="色を選ぶ"></button>
    <button type="submit">追加</button>
  </form>

  <p class="mp-hint">
    数字キー（1〜9・0）でアクティブな用語を切り替え、矢印キーで移動します。
    左右は隣の一致、上下は画面外へ大きくジャンプします。<br>
    <code>Alt+M</code> でこのウィンドウの表示/前面化。1日以上動かしていない
    用語は自動で消えます。
  </p>
  <p class="mp-pageinfo" aria-live="polite"></p>
</div>
<script src=".markers-panel.js" defer></script>
</body>
</html>
