<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="13">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>

  <!-- 段階の帯 -->
  <rect x="10" y="74" width="880" height="122" fill="#f3f6fb"/>
  <rect x="10" y="196" width="880" height="114" fill="#ffffff"/>
  <rect x="10" y="310" width="880" height="160" fill="#f4f9f2"/>
  <rect x="10" y="470" width="880" height="96" fill="#ffffff"/>
  <rect x="10" y="566" width="880" height="56" fill="#fbf4f4"/>
  <text x="20" y="96" font-weight="bold" fill="#555">接続</text>
  <text x="20" y="218" font-weight="bold" fill="#555">時刻のずれ</text>
  <text x="20" y="332" font-weight="bold" fill="#555">本文の同期</text>
  <text x="20" y="492" font-weight="bold" fill="#555">再読み込み</text>
  <text x="20" y="588" font-weight="bold" fill="#555">切断</text>

  <!-- 参加者と線 -->
  <rect x="140" y="18" width="140" height="40" rx="6" fill="#ffffff" stroke="#3178c6" stroke-width="2"/>
  <text x="210" y="43" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4f8f">編集画面</text>
  <rect x="460" y="18" width="140" height="40" rx="6" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
  <text x="530" y="43" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6b41">エディタ</text>
  <line x1="210" y1="58" x2="210" y2="622" stroke="#999" stroke-width="1.5"/>
  <line x1="530" y1="58" x2="530" y2="622" stroke="#999" stroke-width="1.5"/>

  <!-- 接続 -->
  <line x1="210" y1="110" x2="528" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="370" y="103" text-anchor="middle" fill="#333">WebSocket につなぐ（Origin を確かめる）</text>
  <line x1="210" y1="145" x2="528" y2="145" stroke="#333" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="370" y="138" text-anchor="middle" fill="#333">hello（セッション ID・ページ・全文・ハッシュ）</text>
  <text x="546" y="142" fill="#333">バッファを開く</text>
  <text x="546" y="159" fill="#666">（同じセッション ID なら引き継ぐ）</text>
  <line x1="530" y1="180" x2="212" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="370" y="173" text-anchor="middle" fill="#333">welcome（名前・引き継いだか・ハッシュ）</text>

  <!-- 時刻のずれ -->
  <line x1="210" y1="230" x2="528" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="370" y="223" text-anchor="middle" fill="#333">ping</text>
  <line x1="530" y1="262" x2="212" y2="262" stroke="#333" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="370" y="255" text-anchor="middle" fill="#333">pong（t0・t1・t2）</text>
  <line x1="210" y1="294" x2="528" y2="294" stroke="#333" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="370" y="287" text-anchor="middle" fill="#333">clock（推定した時刻のずれ）</text>
  <text x="546" y="266" fill="#666">つないだときと、20 秒ごと</text>

  <!-- 本文の同期 -->
  <line x1="530" y1="344" x2="212" y2="344" stroke="#333" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="370" y="337" text-anchor="middle" fill="#333">edit（from・to・changes）</text>
  <text x="546" y="348" fill="#333">エディタで打った</text>
  <line x1="530" y1="376" x2="212" y2="376" stroke="#333" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="370" y="369" text-anchor="middle" fill="#333">cursor</text>
  <line x1="210" y1="408" x2="528" y2="408" stroke="#333" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="370" y="401" text-anchor="middle" fill="#333">edit</text>
  <text x="546" y="412" fill="#333">編集画面で打った</text>
  <line x1="530" y1="444" x2="212" y2="444" stroke="#333" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="370" y="437" text-anchor="middle" fill="#333">save</text>
  <text x="546" y="440" fill="#333">エディタで保存した</text>
  <text x="546" y="457" fill="#666">→ 編集画面が保存して再読み込みする</text>

  <!-- 再読み込み -->
  <line x1="210" y1="500" x2="530" y2="500" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="370" y="493" text-anchor="middle" fill="#c0392b">接続が切れる（bye なし）</text>
  <text x="546" y="504" fill="#666">エディタはバッファを 10 秒保つ</text>
  <line x1="210" y1="540" x2="528" y2="540" stroke="#333" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="370" y="533" text-anchor="middle" fill="#333">hello（同じセッション ID）</text>
  <text x="546" y="544" fill="#333">同じバッファを引き継ぐ</text>

  <!-- 切断 -->
  <line x1="210" y1="598" x2="528" y2="598" stroke="#333" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="370" y="591" text-anchor="middle" fill="#333">bye</text>
  <text x="546" y="594" fill="#333">切断・タブを閉じた</text>
  <text x="546" y="611" fill="#666">→ バッファを閉じる</text>

  <!-- 凡例 -->
  <line x1="30" y1="652" x2="80" y2="652" stroke="#333" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="92" y="656" fill="#333">メッセージ（WebSocket の text のフレーム1つに1つ。JSON）。矢印の向きが送る向き</text>
  <line x1="30" y1="680" x2="80" y2="680" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="92" y="684" fill="#333">接続が切れる（保存・ページの切り替えで編集画面が再読み込みされるとき）</text>
</svg>
